blueprint:
  name: Thermostat manual override handler
  author: wkethman
  description: >-
    v2.1 - Manual AC override handler. When a user manually changes the
    thermostat's target temperature (or turns the override toggle on), this
    automation turns the override toggle on and (re)starts the countdown held
    in an input_timer helper. When the timer finishes, the toggle is turned
    off and the scheduled AC automation resumes control. Repeated manual
    changes RESET the countdown; it also re-arms if Home Assistant restarts
    mid-override.
    Changelog: v2.1 (2026-11-08) versioned description. v2.0 (2026-11-08)
    replaced the in-automation delay with an input_timer helper so device-side
    temperature changes can no longer cancel the countdown (the old version
    could stick the toggle on indefinitely); repeated manual changes reset the
    window, and the countdown re-arms after a Home Assistant restart.
  source_url: https://github.com/wkethman/manual_ac_override/raw/main/manual_ac_override.yaml
  domain: automation
  input:
    climate_entity:
      name: Target Climate Device
      description: The climate entity (thermostat) to monitor for manual changes.
      selector:
        entity:
          domain: climate

    override_toggle:
      name: Override Toggle Helper
      description: The input_boolean helper that acts as the override switch.
      selector:
        entity:
          domain: input_boolean

    override_timer:
      name: Override Countdown Timer
      description: >-
        An input_timer helper that holds the override countdown. Each manual
        temperature change (re)starts it; it is also re-armed on Home
        Assistant startup if the override is still active.
      selector:
        entity:
          domain: input_timer

    override_duration_hours:
      name: Override Duration (Hours)
      description: How many hours the manual override should last before resetting.
      default: 2
      selector:
        number:
          min: 0
          max: 24
          step: 1
          unit_of_measurement: hours

# Runs are short (no blocking delays), so 'single' is safe. Crucially, a
# device-side thermostat attribute change can no longer cancel a pending
# countdown, which is what made the previous delay-based version stick
# the toggle 'on' indefinitely.
mode: single

trigger:
  # Trigger 1: The thermostat temperature attribute changed (device or user).
  - platform: state
    entity_id: !input climate_entity
    attribute: temperature
    id: "thermostat_changed"

  # Trigger 2: The override switch is manually turned on.
  - platform: state
    entity_id: !input override_toggle
    to: "on"
    id: "override_enabled"

  # Trigger 3: The countdown timer finished (starting -> idle).
  - platform: state
    entity_id: !input override_timer
    to: "idle"
    id: "timer_finished"

  # Trigger 4: Home Assistant restarted. If the override is still active but
  # no timer is running (e.g. HA restarted mid-countdown), re-arm the timer
  # so the override cannot stay on forever.
  - platform: event
    event_type: homeassistant_started
    id: "ha_started"

action:
  - choose:
      # Case 1: The thermostat was changed MANUALLY (by a user).
      - conditions:
          - condition: trigger
            id: "thermostat_changed"
          # This template ensures the change came from a user, not another
          # automation or the device itself.
          - condition: template
            value_template: "{{ trigger.to_state.context.user_id is not none }}"
        sequence:
          # Turn on the override switch.
          - service: input_boolean.turn_on
            target:
              entity_id: !input override_toggle
          # (Re)start the countdown. A second manual change resets the timer
          # instead of cancelling the countdown.
          - service: timer.start
            target:
              entity_id: !input override_timer
            data:
              duration:
                hours: !input override_duration_hours

      # Case 2: The override switch was just turned on manually.
      - conditions:
          - condition: trigger
            id: "override_enabled"
        sequence:
          - service: timer.start
            target:
              entity_id: !input override_timer
            data:
              duration:
                hours: !input override_duration_hours

      # Case 3: The countdown finished -> release the override.
      - conditions:
          - condition: trigger
            id: "timer_finished"
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: !input override_toggle

      # Case 4: HA restarted with the override still active but no running
      # timer -> give it a fresh countdown window so it self-heals.
      - conditions:
          - condition: trigger
            id: "ha_started"
          - condition: state
            entity_id: !input override_toggle
            state: "on"
          - condition: state
            entity_id: !input override_timer
            state: "idle"
        sequence:
          - service: timer.start
            target:
              entity_id: !input override_timer
            data:
              duration:
                hours: !input override_duration_hours
